[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"
description = "A tray switch for systemd user units"
license = "MIT"
repository = "https://github.com/cosmicspork/switchboard-linux"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
ksni = "0.3.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "process", "signal"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
